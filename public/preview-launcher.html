<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Revox Widget UI Preview</title>
    <style>
      :root {
        --primary: #635bff;
        --secondary: #111827;
        --bg: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --line: rgba(15, 23, 42, 0.09);
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 18% 12%, rgba(99, 91, 255, 0.11), transparent 30%),
          radial-gradient(circle at 85% 24%, rgba(17, 24, 39, 0.08), transparent 28%),
          linear-gradient(135deg, #f8fafc, #eef2ff 48%, #ffffff);
      }

      main {
        max-width: 780px;
        padding: 72px 40px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 44px;
        line-height: 1.05;
      }

      p {
        max-width: 560px;
        font-size: 18px;
        line-height: 1.55;
        color: #4b5563;
      }

      button {
        font: inherit;
      }

      .launcher {
        position: fixed;
        right: 24px;
        bottom: 24px;
        min-width: 184px;
        height: 70px;
        padding: 9px 12px 9px 10px;
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 24px;
        background:
          linear-gradient(135deg, rgba(255,255,255,0.28), rgba(255,255,255,0.08)),
          radial-gradient(circle at 22% 18%, rgba(255,255,255,0.5), transparent 34%),
          linear-gradient(135deg, var(--primary), var(--secondary) 94%);
        color: #ffffff;
        box-shadow:
          0 22px 54px rgba(15, 23, 42, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.42);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        isolation: isolate;
        overflow: hidden;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .launcher:hover {
        transform: translateY(-3px);
        box-shadow:
          0 28px 70px rgba(15, 23, 42, 0.34),
          inset 0 1px 0 rgba(255, 255, 255, 0.46);
      }

      .launcher-icon {
        position: relative;
        width: 48px;
        height: 48px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
        box-shadow:
          inset 0 0 0 1px rgba(255,255,255,0.24),
          0 10px 22px rgba(15,23,42,0.2);
      }

      .launcher-status {
        position: absolute;
        right: -2px;
        top: -2px;
        width: 13px;
        height: 13px;
        border: 2px solid rgba(255,255,255,0.92);
        border-radius: 999px;
        background: #22c55e;
      }

      .launcher-copy {
        display: grid;
        gap: 1px;
        min-width: 0;
        text-align: left;
      }

      .launcher-copy strong,
      .launcher-copy span {
        display: block;
        max-width: 104px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .launcher-copy strong {
        font-size: 14.5px;
        line-height: 1.1;
        font-weight: 760;
      }

      .launcher-copy span {
        font-size: 11px;
        line-height: 1.15;
        opacity: 0.74;
      }

      .launcher-action {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        background: rgba(255,255,255,0.18);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
      }

      .mock-window {
        position: fixed;
        right: 24px;
        bottom: 110px;
        width: min(392px, calc(100vw - 32px));
        height: min(640px, calc(100vh - 132px));
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 20px;
        overflow: hidden;
        background: var(--bg);
        box-shadow:
          0 28px 80px rgba(15, 23, 42, 0.24),
          0 0 0 1px rgba(15, 23, 42, 0.04);
        display: none;
        grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      }

      .mock-window[data-open="true"] {
        display: grid;
      }

      .mock-header {
        min-height: 82px;
        padding: 15px 14px 15px 16px;
        background:
          radial-gradient(circle at 92% -10%, rgba(255,255,255,0.28), transparent 34%),
          linear-gradient(135deg, var(--secondary), var(--primary));
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .mock-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .mock-avatar {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: rgba(255,255,255,0.16);
        border: 1px solid rgba(255,255,255,0.22);
        flex: 0 0 auto;
      }

      .mock-title {
        min-width: 0;
      }

      .mock-title strong,
      .mock-title span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mock-title span {
        width: fit-content;
        margin-top: 6px;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(255,255,255,0.16);
        font-size: 11.5px;
      }

      .mock-title span::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 6px;
        border-radius: 999px;
        background: #22c55e;
        vertical-align: 1px;
      }

      .mock-close {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 999px;
        background: rgba(255,255,255,0.15);
        color: #ffffff;
        cursor: pointer;
        display: grid;
        place-items: center;
      }

      .mode-switch {
        height: 62px;
        min-height: 62px;
        max-height: 62px;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.06);
        background: rgba(255,255,255,0.96);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        overflow: hidden;
      }

      .mode-switch button {
        appearance: none;
        width: 100%;
        height: 40px;
        min-width: 0;
        min-height: 40px;
        max-height: 40px;
        padding: 0 12px;
        border: 1px solid rgba(15, 23, 42, 0.06);
        border-radius: 14px;
        background: transparent;
        color: #4b5563;
        cursor: pointer;
        font-size: 13.5px;
        line-height: 1;
        font-weight: 750;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        overflow: hidden;
        white-space: nowrap;
      }

      .mode-switch button[aria-pressed="true"] {
        background: #ffffff;
        border-color: rgba(15, 23, 42, 0.08);
        color: var(--text);
        box-shadow:
          0 10px 24px rgba(15, 23, 42, 0.08),
          inset 0 -2px 0 var(--primary);
      }

      .mock-body {
        padding: 16px 14px 14px;
        overflow: auto;
        background:
          radial-gradient(circle at 12% 0%, rgba(99, 91, 255, 0.1), transparent 28%),
          radial-gradient(circle at 90% 14%, rgba(17, 24, 39, 0.08), transparent 24%),
          linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.92));
      }

      .mock-body[data-mode="voice"] {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 12px;
        overflow: hidden;
      }

      .voice-preview {
        min-height: 250px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 18px;
        background:
          radial-gradient(circle at 50% 38%, rgba(99, 91, 255, 0.18), transparent 30%),
          radial-gradient(circle at 46% 48%, rgba(17, 24, 39, 0.12), transparent 36%),
          rgba(255,255,255,0.76);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .voice-orb {
        position: relative;
        width: min(208px, 58vw);
        aspect-ratio: 1;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 42% 34%, rgba(255,255,255,0.72), transparent 22%),
          conic-gradient(from 160deg, var(--primary), var(--secondary), var(--primary));
        box-shadow: 0 28px 70px rgba(99, 91, 255, 0.24);
      }

      .voice-bars {
        width: 74%;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }

      .voice-bars span {
        width: 7px;
        min-height: 10px;
        border-radius: 999px;
        background: rgba(255,255,255,0.9);
        box-shadow: 0 0 18px rgba(255,255,255,0.38);
        animation: pulse 1s ease-in-out infinite;
      }

      .voice-bars span:nth-child(1) { height: 20px; animation-delay: 0ms; }
      .voice-bars span:nth-child(2) { height: 38px; animation-delay: 80ms; }
      .voice-bars span:nth-child(3) { height: 56px; animation-delay: 160ms; }
      .voice-bars span:nth-child(4) { height: 32px; animation-delay: 240ms; }
      .voice-bars span:nth-child(5) { height: 46px; animation-delay: 320ms; }
      .voice-bars span:nth-child(6) { height: 24px; animation-delay: 400ms; }

      .voice-transcript {
        min-height: 70px;
        padding: 12px 13px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 14px;
        background: rgba(255,255,255,0.86);
        color: #4b5563;
        font-size: 13px;
        line-height: 1.45;
      }

      .voice-transcript strong {
        display: block;
        margin-bottom: 4px;
        color: var(--text);
        font-size: 12px;
      }

      .mock-message-row {
        display: flex;
        margin-bottom: 12px;
      }

      .mock-message-row.visitor {
        justify-content: flex-end;
      }

      .mock-message {
        max-width: 82%;
        padding: 11px 13px;
        border-radius: 15px 15px 15px 7px;
        background: #ffffff;
        border: 1px solid rgba(17, 24, 39, 0.14);
        color: var(--text);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
        font-size: 14px;
        line-height: 1.5;
      }

      .visitor .mock-message {
        border: 0;
        border-radius: 15px 15px 7px 15px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: #ffffff;
      }

      .status {
        min-height: 24px;
        padding: 0 14px 8px;
        background: rgba(255,255,255,0.9);
        color: var(--muted);
        font-size: 12px;
      }

      .mock-start {
        padding: 13px 14px 15px;
        border-top: 1px solid var(--line);
        background: rgba(249,250,251,0.92);
      }

      .mock-start button {
        width: 100%;
        min-height: 46px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: #ffffff;
        cursor: pointer;
        font-weight: 750;
        box-shadow: 0 12px 26px rgba(99, 91, 255, 0.28);
      }

      .mock-footer {
        padding: 8px 12px 10px;
        border-top: 1px solid rgba(15, 23, 42, 0.07);
        background: rgba(255,255,255,0.82);
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }

      .mock-footer strong {
        color: var(--primary);
      }

      @keyframes pulse {
        0%, 100% {
          transform: scaleY(0.72);
          opacity: 0.62;
        }

        50% {
          transform: scaleY(1.14);
          opacity: 1;
        }
      }

      @media (max-width: 520px) {
        main {
          padding: 44px 24px;
        }

        h1 {
          font-size: 36px;
        }

        .launcher {
          right: 12px;
          bottom: 12px;
          height: 62px;
          min-width: 136px;
        }

        .mock-window {
          left: 12px;
          right: 12px;
          bottom: 86px;
          width: auto;
          height: min(640px, calc(100vh - 104px));
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Revox widget preview</h1>
      <p>Click the minimized launcher in the bottom corner to preview the cleaner chat UI.</p>
    </main>

    <section class="mock-window" data-open="false" aria-label="Sierra chat preview">
      <header class="mock-header">
        <div class="mock-brand">
          <div class="mock-avatar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 8.5C5 6.57 6.57 5 8.5 5h7C17.43 5 19 6.57 19 8.5v4.2c0 1.93-1.57 3.5-3.5 3.5H12l-4.2 2.55a.8.8 0 0 1-1.2-.68V16.1A3.5 3.5 0 0 1 5 12.7V8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="mock-title">
            <strong>Sierra</strong>
            <span>Secure AI chat</span>
          </div>
        </div>
        <button class="mock-close" type="button" aria-label="Close preview">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </header>
      <div class="mode-switch" role="tablist" aria-label="Conversation mode">
        <button type="button" data-preview-mode="chat" aria-pressed="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7.5 9.5h9M7.5 13h5.5M6.8 18.4l3-1.8h5.7a4 4 0 0 0 4-4V8.5a4 4 0 0 0-4-4h-7a4 4 0 0 0-4 4v4.1a4 4 0 0 0 2.3 3.6v2.2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Chat
        </button>
        <button type="button" data-preview-mode="voice" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M18.5 11.5v.5a6.5 6.5 0 0 1-13 0v-.5M12 18.5V21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          Voice
        </button>
      </div>
      <div class="mock-body" data-mode="chat">
        <div class="mock-message-row">
          <div class="mock-message">Welcome to ABC Insurance. How may I help you?</div>
        </div>
        <div class="mock-message-row visitor">
          <div class="mock-message">Can you help me compare plans?</div>
        </div>
      </div>
      <div class="status">Connected securely</div>
      <div class="mock-start">
        <button type="button">Start chat</button>
      </div>
      <footer class="mock-footer">Powered by <strong>Revox</strong></footer>
    </section>

    <button class="launcher" type="button" aria-label="Open chat preview">
      <span class="launcher-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 8.5C5 6.57 6.57 5 8.5 5h7C17.43 5 19 6.57 19 8.5v4.2c0 1.93-1.57 3.5-3.5 3.5H12l-4.2 2.55a.8.8 0 0 1-1.2-.68V16.1A3.5 3.5 0 0 1 5 12.7V8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span class="launcher-status" aria-hidden="true"></span>
      </span>
      <span class="launcher-copy">
        <strong>Ask Sierra</strong>
        <span>AI assistant</span>
      </span>
      <span class="launcher-action" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </button>

    <script>
      const launcher = document.querySelector(".launcher");
      const mockWindow = document.querySelector(".mock-window");
      const closeButton = document.querySelector(".mock-close");
      const modeButtons = document.querySelectorAll("[data-preview-mode]");
      const mockBody = document.querySelector(".mock-body");

      launcher.addEventListener("click", () => {
        mockWindow.dataset.open = mockWindow.dataset.open === "true" ? "false" : "true";
      });

      closeButton.addEventListener("click", () => {
        mockWindow.dataset.open = "false";
      });

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const mode = button.dataset.previewMode;
          modeButtons.forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });

          mockBody.dataset.mode = mode;
          mockBody.innerHTML =
            mode === "voice"
              ? `<div class="voice-preview">
                  <div class="voice-orb">
                    <div class="voice-bars" aria-hidden="true">
                      <span></span><span></span><span></span><span></span><span></span><span></span>
                    </div>
                  </div>
                </div>
                <div class="voice-transcript">
                  <strong>Live transcript</strong>
                  Start voice and speak naturally.
                </div>`
              : `<div class="mock-message-row">
                  <div class="mock-message">Welcome to ABC Insurance. How may I help you?</div>
                </div>
                <div class="mock-message-row visitor">
                  <div class="mock-message">Can you help me compare plans?</div>
                </div>`;
        });
      });
    </script>
  </body>
</html>
